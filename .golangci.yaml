version: 2

run:
  timeout: 5m
  go: "1.25"

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
    settings:
      shadow:
        strict: true
  
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
      - opinionated
    disabled-checks:
      - wrapperFunc

  revive:
    ignore-generated-header: true
    severity: warning
    rules:
      - name: exported
        arguments: ["disable"]
      - name: var-naming
        arguments: [["ID"], []]

  nolintlint:
    allow-unused: false
    require-explanation: true

linters:
  disable-all: true
  enable:  
    - govet         
    - ineffassign   
    - staticcheck   
    - unused        
    - gocritic      
    - goconst       
    - bodyclose
    - sqlclosecheck
    - asciicheck
    - makezero
    - gosec
  disable:
    - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-dirs:
    - scripts
    - mocks